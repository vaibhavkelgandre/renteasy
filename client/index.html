<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentEasy — rent almost anything, by the hour, day or month</title>

    <!-- Matches --color-canvas of whichever theme is active — hooks/useTheme.js
         keeps this meta's `content` in sync on every toggle. The value here is
         only the pre-JS default (light, matching the script below), for the
         instant before that script has run. -->
    <meta name="theme-color" content="#F8F9FB" />
    <!-- Both, "light" first since that is now the default: this is a HINT the
         browser can use before any CSS has run, and the app supports either. The
         actual, current scheme is decided by the `color-scheme` CSS property
         (index.css) and the inline style the script below sets — both outrank
         this tag once they apply. -->
    <meta name="color-scheme" content="light dark" />

    <!-- THE NO-FLASH-OF-THE-WRONG-THEME SCRIPT. Must run synchronously, in <head>,
         before any stylesheet paints — React mounting later would show one frame
         (or, on a slow connection, much longer) of the wrong theme first. Reads a
         stored choice; a first-ever visit defaults to LIGHT, by direct request —
         not the OS preference, so a visitor whose system is set to dark still
         lands on the same light storefront everyone else does. An explicit toggle
         (persisted to localStorage) is the only thing that overrides this from
         then on. hooks/useTheme.js reads `documentElement.dataset.theme` right
         back off the DOM rather than re-deriving this, so the two can never
         disagree. -->
    <script>
      (function () {
        var stored = localStorage.getItem("renteasy-theme");
        var theme = stored === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <!-- ONE TYPEFACE: Manrope.
         The previous build used the system stack to avoid a blocking request, and the
         concern was right — so this is loaded the way that concern is actually
         answered rather than by going without. `preconnect` opens the connection
         before the CSS is parsed, and `display=swap` paints in the fallback
         immediately and swaps when the font lands: no blank text, ever.

         Manrope rather than Inter: Inter is the default of every AI-generated
         interface and reads as one. Manrope is geometric enough to look designed at
         display sizes, and its digits are unusually even, which matters on a page
         whose job is comparing prices. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
