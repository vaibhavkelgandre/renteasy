<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentEasy — rent almost anything, by the hour, day or month</title>

    <!-- Matches --color-canvas, so the mobile browser chrome and the page are one
         surface. A pale strip above a near-black page is the most visible way a dark
         site gives itself away as a retrofit. -->
    <meta name="theme-color" content="#0A0B0D" />
    <!-- Tells the browser to draw its own widgets (scrollbars, form controls, the
         PDF viewer) dark. Without it Chrome renders a bright scrollbar down the side
         of a dark page. -->
    <meta name="color-scheme" content="dark" />

    <!-- ONE TYPEFACE: Manrope.
         The previous build used the system stack to avoid a blocking request, and the
         concern was right — so this is loaded the way that concern is actually
         answered rather than by going without. `preconnect` opens the connection
         before the CSS is parsed, and `display=swap` paints in the fallback
         immediately and swaps when the font lands: no blank text, ever.

         Manrope rather than Inter: Inter is the default of every AI-generated
         interface and reads as one. Manrope is geometric enough to look designed at
         display sizes, and its digits are unusually even, which matters on a page
         whose job is comparing prices. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
